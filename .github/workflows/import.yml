name: Importar imagens
on:
  push:
    paths: ['_import/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          while read -r dest url; do
            [ -z "$dest" ] && continue
            mkdir -p "$(dirname "$dest")"
            curl -sSL --fail -o "$dest" "$url"
          done < _import/urls.txt
          : > _import/urls.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importa imagens" || exit 0
          git push
